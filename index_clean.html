<!doctype html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1" name="viewport" />
    <meta content="#101a38" name="theme-color" />
    <title>سوق المبرمجين العرب</title>
    <style>
      :root {
        --navy: #101a38;
        --ink: #14203d;
        --muted: #66738d;
        --blue: #3157e7;
        --sky: #eaf0ff;
        --line: #e3e8f1;
        --bg: #f6f8fc;
        --green: #13885e;
        --red: #c84251;
        --shadow: 0 16px 45px rgba(26, 44, 84, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Tahoma,
          sans-serif;
        line-height: 1.7;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      img {
        max-width: 100%;
      }
      main {
        min-height: 72vh;
      }
      .wrap {
        width: min(1160px, calc(100% - 32px));
        margin: auto;
      }
      .topbar {
        background: var(--navy);
        color: #cbd5ed;
        font-size: 13px;
        text-align: center;
        padding: 6px 12px;
      }
      .header {
        background: #fff;
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 30;
      }
      .nav {
        display: flex;
        align-items: center;
        gap: 28px;
        min-height: 72px;
      }
      .brand {
        font-size: 20px;
        font-weight: 900;
        color: var(--navy);
        white-space: nowrap;
      }
      .brand b {
        color: var(--blue);
      }
      .navlinks {
        display: flex;
        gap: 22px;
        color: #586581;
        font-size: 14px;
      }
      .navlinks a:hover {
        color: var(--blue);
      }
      .nav-actions {
        margin-right: auto;
        display: flex;
        gap: 9px;
        align-items: center;
      }
      .btn {
        border: 1px solid transparent;
        border-radius: 12px;
        padding: 10px 17px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-height: 42px;
        background: #fff;
        color: var(--ink);
      }
      .btn:hover {
        filter: brightness(0.97);
      }
      .btn.primary {
        background: var(--blue);
        color: #fff;
      }
      .btn.soft {
        background: var(--sky);
        color: var(--blue);
      }
      .btn.line {
        border-color: var(--line);
      }
      .btn.green {
        background: #e1f8ed;
        color: #08704c;
      }
      .btn.danger {
        background: #fff0f1;
        color: var(--red);
      }
      .btn.small {
        padding: 7px 11px;
        min-height: 35px;
        font-size: 13px;
      }
      .btn:disabled {
        opacity: 0.55;
        cursor: wait;
      }
      .hero {
        background:
          radial-gradient(circle at 15% 25%, #3c63d7 0, transparent 30%),
          linear-gradient(125deg, #111c3d, #1c3670 68%, #2a55a4);
        color: #fff;
        padding: 82px 0 95px;
      }
      .hero-grid {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 45px;
        align-items: center;
      }
      .eyebrow {
        color: #a9c4ff;
        font-weight: 800;
      }
      .hero h1 {
        font-size: clamp(34px, 5vw, 58px);
        line-height: 1.25;
        margin: 14px 0;
      }
      .hero h1 em {
        color: #96d8ff;
        font-style: normal;
      }
      .hero p {
        color: #d4def7;
        font-size: 18px;
        max-width: 620px;
      }
      .search-box {
        display: flex;
        background: #fff;
        border-radius: 15px;
        padding: 7px;
        gap: 8px;
        box-shadow: 0 17px 30px #0a143055;
        margin-top: 28px;
      }
      .search-box input {
        border: 0;
        outline: 0;
        flex: 1;
        min-width: 0;
        padding: 10px 14px;
        color: var(--ink);
      }
      .hero-note {
        font-size: 13px;
        color: #c4d3ef;
        margin-top: 15px;
      }
      .hero-art {
        background: #ffffff12;
        border: 1px solid #ffffff30;
        border-radius: 24px;
        padding: 24px;
        transform: rotate(-2deg);
        box-shadow: 0 30px 70px #08133370;
      }
      .art-card {
        background: #fff;
        color: var(--ink);
        border-radius: 18px;
        padding: 18px;
        margin-bottom: 12px;
        display: flex;
        gap: 13px;
        align-items: center;
      }
      .art-card:last-child {
        margin-bottom: 0;
      }
      .art-icon {
        font-size: 26px;
        background: #eef3ff;
        padding: 8px 12px;
        border-radius: 12px;
      }
      .art-card small {
        display: block;
        color: var(--muted);
      }
      .section {
        padding: 65px 0;
      }
      .section.alt {
        background: #fff;
      }
      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        margin-bottom: 23px;
      }
      .section h2,
      .page-title {
        margin: 0;
        font-size: clamp(25px, 3vw, 34px);
        line-height: 1.35;
      }
      .sub {
        color: var(--muted);
        margin: 7px 0 0;
      }
      .pill-row {
        display: flex;
        gap: 9px;
        overflow: auto;
        padding: 2px 0 14px;
      }
      .pill {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 99px;
        padding: 9px 16px;
        white-space: nowrap;
        color: #4f5d79;
      }
      .pill.active,
      .pill:hover {
        background: var(--navy);
        color: #fff;
        border-color: var(--navy);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 19px;
      }
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }
      .card-cover {
        height: 172px;
        background: linear-gradient(135deg, #e0e9ff, #dff8f6);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 42px;
        overflow: hidden;
      }
      .card-cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .card-body {
        padding: 19px;
      }
      .tag {
        display: inline-block;
        background: #edf1ff;
        color: #3657c4;
        border-radius: 7px;
        padding: 3px 9px;
        font-size: 12px;
        font-weight: 800;
      }
      .card h3 {
        font-size: 18px;
        margin: 10px 0 7px;
        line-height: 1.5;
      }
      .card p {
        color: var(--muted);
        font-size: 14px;
        margin: 0 0 15px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        min-height: 45px;
      }
      .card-foot {
        border-top: 1px solid var(--line);
        padding-top: 13px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .person {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 13px;
        min-width: 0;
      }
      .avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #dfe7ff;
        color: #3157c6;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        overflow: hidden;
        flex: none;
      }
      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .avatar.big {
        width: 105px;
        height: 105px;
        font-size: 38px;
        border: 4px solid white;
      }
      .price {
        font-size: 19px;
        color: var(--green);
        font-weight: 900;
        white-space: nowrap;
      }
      .empty {
        border: 1px dashed #b8c4d7;
        background: #fff;
        border-radius: 18px;
        text-align: center;
        padding: 50px 24px;
        color: var(--muted);
        grid-column: 1/-1;
      }
      .empty strong {
        display: block;
        color: var(--ink);
        font-size: 19px;
      }
      .feature-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
      }
      .feature {
        background: #f7f9fd;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 22px;
      }
      .feature span {
        font-size: 28px;
      }
      .feature h3 {
        margin: 9px 0 4px;
      }
      .feature p {
        color: var(--muted);
        margin: 0;
        font-size: 14px;
      }
      .page {
        padding: 38px 0 80px;
      }
      .breadcrumbs {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 22px;
      }
      .breadcrumbs a {
        color: var(--blue);
      }
      .detail-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 24px;
        align-items: start;
      }
      .panel {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 24px;
        box-shadow: var(--shadow);
      }
      .panel + .panel {
        margin-top: 17px;
      }
      .cover-large {
        height: 300px;
        border-radius: 13px;
        background: #e6edff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 65px;
        overflow: hidden;
        margin: 17px 0;
      }
      .cover-large img {
        height: 100%;
        width: 100%;
        object-fit: cover;
      }
      .content-text {
        white-space: pre-wrap;
        line-height: 2;
        color: #44516d;
        overflow-wrap: anywhere;
      }
      .muted {
        color: var(--muted);
      }
      .seller-hero {
        background: linear-gradient(120deg, #172b61, #274ba0);
        color: #fff;
        border-radius: 22px;
        padding: 30px;
        display: flex;
        gap: 22px;
        align-items: center;
        margin-bottom: 23px;
      }
      .seller-hero h1 {
        margin: 0 0 3px;
      }
      .seller-hero p {
        margin: 0;
        color: #d5e2ff;
      }
      .seller-hero .avatar {
        width: 100px;
        height: 100px;
        font-size: 36px;
      }
      .seller-hero .tag {
        background: #ffffff25;
        color: #fff;
      }
      .portfolio-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 17px;
      }
      .work-img {
        height: 190px;
        background: #e6ecfa;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 45px;
      }
      .work-img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .dashboard {
        display: grid;
        grid-template-columns: 240px minmax(0, 1fr);
        gap: 20px;
      }
      .dash-nav {
        align-self: start;
        position: sticky;
        top: 92px;
      }
      .dash-nav button {
        display: block;
        width: 100%;
        background: transparent;
        border: 0;
        text-align: right;
        padding: 13px 14px;
        color: #4c5a75;
        border-radius: 10px;
      }
      .dash-nav button.active,
      .dash-nav button:hover {
        background: #eaf0ff;
        color: var(--blue);
        font-weight: 800;
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }
      .field {
        margin: 0 0 16px;
      }
      .field label {
        display: block;
        font-size: 14px;
        font-weight: 800;
        margin-bottom: 6px;
      }
      .field input,
      .field select,
      .field textarea,
      .search-inline {
        width: 100%;
        border: 1px solid #cad4e4;
        border-radius: 11px;
        padding: 11px 13px;
        background: #fff;
        color: var(--ink);
        outline: none;
      }
      .field input:focus,
      .field textarea:focus,
      .field select:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px #3157e725;
      }
      .field textarea {
        min-height: 130px;
        resize: vertical;
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
      }
      .upload-box {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .upload-box input {
        display: none;
      }
      .preview {
        width: 100px;
        height: 100px;
        object-fit: cover;
        border-radius: 12px;
        border: 1px solid var(--line);
        display: none;
      }
      .notice {
        border-radius: 12px;
        padding: 11px 14px;
        margin: 12px 0;
        background: #eff5ff;
        color: #244b98;
      }
      .notice.error {
        background: #fff0f1;
        color: #9d2636;
      }
      .notice.success {
        background: #e9f9ef;
        color: #0c704a;
      }
      .item-row {
        border: 1px solid var(--line);
        border-radius: 13px;
        padding: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        margin-top: 12px;
      }
      .modal {
        position: fixed;
        inset: 0;
        background: #0a1430aa;
        z-index: 60;
        display: grid;
        place-items: center;
        padding: 16px;
      }
      .modal-box {
        width: min(480px, 100%);
        background: #fff;
        border-radius: 20px;
        padding: 25px;
        max-height: 94vh;
        overflow: auto;
        position: relative;
      }
      .modal-close {
        position: absolute;
        left: 15px;
        top: 15px;
        border: 0;
        background: #f1f4fa;
        border-radius: 9px;
        font-size: 23px;
        width: 35px;
        height: 35px;
      }
      .tabs {
        display: flex;
        gap: 8px;
        margin: 18px 0;
      }
      .tabs button {
        flex: 1;
        border: 0;
        background: #eef2fa;
        border-radius: 10px;
        padding: 10px;
      }
      .tabs button.active {
        background: var(--blue);
        color: #fff;
      }
      .footer {
        background: var(--navy);
        color: #c7d2ea;
        padding: 35px 0;
        font-size: 14px;
      }
      .footer .wrap {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        flex-wrap: wrap;
      }
      .loading {
        text-align: center;
        padding: 50px;
        color: var(--muted);
      }
      .setup {
        margin: 45px auto;
        max-width: 720px;
      }
      .top-gap {
        margin-top: 22px;
      }
      @media (max-width: 850px) {
        .hero-grid {
          grid-template-columns: 1fr;
        }
        .hero-art {
          display: none;
        }
        .grid,
        .portfolio-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .detail-grid,
        .dashboard {
          grid-template-columns: 1fr;
        }
        .dash-nav {
          position: static;
          display: flex;
          overflow: auto;
          padding: 8px;
        }
        .dash-nav button {
          white-space: nowrap;
          width: auto;
        }
        .navlinks {
          display: none;
        }
      }
      @media (max-width: 570px) {
        .wrap {
          width: calc(100% - 24px);
        }
        .nav {
          gap: 8px;
          min-height: 64px;
        }
        .brand {
          font-size: 15px;
        }
        .nav-actions {
          gap: 5px;
        }
        .nav-actions .btn {
          padding: 7px 9px;
          font-size: 12px;
          min-height: 34px;
        }
        .hero {
          padding: 58px 0;
        }
        .hero p {
          font-size: 15px;
        }
        .grid,
        .portfolio-grid,
        .feature-row,
        .form-grid {
          grid-template-columns: 1fr;
        }
        .section {
          padding: 45px 0;
        }
        .seller-hero {
          align-items: flex-start;
          padding: 20px;
        }
        .seller-hero .avatar {
          width: 70px;
          height: 70px;
        }
        .panel {
          padding: 17px;
        }
        .cover-large {
          height: 220px;
        }
        .item-row {
          align-items: flex-start;
          flex-direction: column;
        }
        .section-head {
          flex-wrap: wrap;
        }
      }

      .ah13-developer {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 9999;

        width: 95px;
        min-height: 58px;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        background: #101a38;
        color: #fff;
        text-decoration: none;

        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.18);

        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);

        transition: 0.2s;
      }

      .ah13-developer strong {
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 1px;
      }

      .ah13-developer span {
        font-size: 10px;
        margin-top: 2px;
        opacity: 0.8;
      }

      .ah13-developer:hover {
        transform: translateY(-2px);
        filter: brightness(1.08);
      }
    </style>
  </head>
  <body>
    <a
      href="https://ahmedhafezfrontend-ah13.netlify.app/"
      target="_blank"
      rel="noopener noreferrer"
      class="ah13-developer"
    >
      <strong>AH13</strong>
      <span>مطور هذا الموقع</span>
    </a>

    <div class="topbar">
      تواصل مباشر بين أصحاب المشاريع والمستقلين · بدون عمولة من الموقع
    </div>
    <header class="header">
      <div class="wrap nav">
        <a class="brand" href="#/">
          ⌘ سوق
          <b> المبرمجين العرب </b>
        </a>
        <nav class="navlinks">
          <a href="#/"> الرئيسية </a>
          <a href="#/services"> تصفح الخدمات </a>
          <a href="#/dashboard/portfolio"> معرض أعمالي </a>
        </nav>
        <div class="nav-actions" id="navActions"></div>
      </div>
    </header>
    <main id="app">
      <div class="loading">جارٍ التحميل…</div>
    </main>
    <footer class="footer">
      <div class="wrap">
        <strong> ⌘ سوق المبرمجين العرب </strong>
        <span> منصة خدمات رقمية بتواصل مباشر </span>
      </div>
    </footer>
    <div id="modalRoot"></div>
    <div
      id="toastRoot"
      style="
        position: fixed;
        bottom: 18px;
        left: 18px;
        z-index: 90;
        max-width: calc(100% - 36px);
      "
    ></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
      const SUPABASE_URL = "https://jgpwdyuvqtnxubekzord.supabase.co";
      const SUPABASE_ANON_KEY =
        "sb_publishable_3eOBTK5W2ZaqYi7M_gwfkg_qeQPVXIM";
      const ready = !!window.supabase;
      const db = ready
        ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
        : null;
      const $ = (selector) => document.querySelector(selector);
      const esc = (value) =>
        String(value ?? "").replace(
          /[&<>"']/g,
          (character) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[character],
        );
      const categories = [
        "الكل",
        "برمجة المواقع",
        "تطبيقات الهاتف",
        "التصميم",
        "المتاجر الإلكترونية",
        "الذكاء الاصطناعي",
        "أخرى",
      ];
      const countries = [
        ["السعودية", "966"],
        ["مصر", "20"],
        ["الإمارات", "971"],
        ["الكويت", "965"],
        ["قطر", "974"],
        ["البحرين", "973"],
        ["عُمان", "968"],
        ["الأردن", "962"],
        ["فلسطين", "970"],
        ["لبنان", "961"],
        ["سوريا", "963"],
        ["العراق", "964"],
        ["اليمن", "967"],
        ["السودان", "249"],
        ["الصومال", "252"],
        ["جيبوتي", "253"],
        ["جزر القمر", "269"],
        ["ليبيا", "218"],
        ["تونس", "216"],
        ["الجزائر", "213"],
        ["المغرب", "212"],
        ["موريتانيا", "222"],
      ];
      let session = null;
      let me = null;
      let selectedFile = null;
      let serviceList = [];
      let filter = {
        category: "الكل",
        query: "",
      };
      let recoveryMode = false;
      function fullName(person) {
        return `${person?.first_name || ""} ${person?.last_name || ""}`.trim();
      }
      function money(value) {
        return `${Number(value).toLocaleString("ar-EG")} $`;
      }
      function imageURL(path) {
        if (!path || !db) return "";
        return db.storage.from("market-images").getPublicUrl(path).data
          .publicUrl;
      }
      function avatar(person, big = false) {

            )}               </select>             </div>              <div class="field">               <label>السعر بالدولار</label>               <input name="price"                      type="number"                      min="1" max="1000000" step="0.01"                      required                      value="${esc(service.price || "")}">             </div>           </div>            <div class="field">             <label>وصف الخدمة</label>             <textarea name="description"                       required minlength="20" maxlength="5000"                       placeholder="ماذا ستقدّم؟ وما المطلوب من العميل؟">${esc(service.description || "")}</textarea>           </div>            ${uploadControls("serviceCover", true)}            <button class="btn primary">             ${id ? "حفظ الخدمة" : "نشر الخدمة"}           </button>         </form>       `;
      }
      async function dashPortfolio() {
        const { data, error } = await db
          .from("portfolio")
          .select("*")
          .eq("seller_id", me.id)
          .order("created_at", {
            ascending: false,
          });
        if (error) return showError(error);
        $("#dashBody").innerHTML =
          `         <div class="section-head">           <h2>معرض أعمالي</h2>           ${me.role === "seller" ? `<button class="btn primary"                        data-action="work-form">                  + أضف عملًا                </button>` : `<span class="hint">                  اختر نوع الحساب «بائع» من ملفك لإضافة أعمال.                </span>`}         </div>          ${data.length ? data.map((work) => `             <div class="item-row">               <div>                 <strong>${esc(work.title)}</strong><br>                 <small class="muted">${esc(work.description)}</small>               </div>                <div>                 <button class="btn small line"                         data-action="work-form"                         data-id="${esc(work.id)}">تعديل</button>                  <button class="btn small danger"                         data-action="delete-work"                         data-id="${esc(work.id)}">حذف</button>               </div>             </div>           `).join("") : `<div class="empty">                معرضك فارغ. أضف صورة ومعلومات عن أحد أعمالك.              </div>`}       `;
      }
      async function workForm(id) {
        if (me?.role !== "seller") {
          return toast("اختر نوع الحساب «بائع» أولًا.", true);
        }
        selectedFile = null;
        let work = {};
        if (id) {
          const result = await db
            .from("portfolio")
            .select("*")
            .eq("id", id)
            .eq("seller_id", me.id)
            .single();
          if (result.error) return showError(result.error);
          work = result.data;
        }
        $("#dashBody").innerHTML =
          `         <button class="btn small line"                 data-action="back-portfolio">           العودة لمعرض أعمالي         </button>          <h2>${id ? "تعديل العمل" : "إضافة عمل للمعرض"}</h2>          <form id="workForm" data-id="${esc(id || "")}">           <div class="field">             <label>عنوان العمل</label>             <input name="title"                    required maxlength="120"                    value="${esc(work.title || "")}">           </div>            <div class="field">             <label>وصف العمل</label>             <textarea name="description"                       maxlength="2000"                       placeholder="ما الذي أنجزته في هذا المشروع؟">${esc(work.description || "")}</textarea>           </div>            <div class="field">             <label>رابط العمل — اختياري</label>             <input name="link"                    type="url"                    placeholder="https://example.com"                    value="${esc(work.link || "")}">           </div>            ${uploadControls("workImage", Boolean(id))}            <button class="btn primary">             ${id ? "حفظ العمل" : "نشر العمل"}           </button>         </form>       `;
      }
      function openAuth(mode = "login") {
        if (!db) return toast("تحقق من اتصال الإنترنت.", true);
        const registering = mode === "register";
        $("#modalRoot").innerHTML =
          `         <div class="modal">           <div class="modal-box">             <button class="modal-close"                     data-action="close"                     aria-label="إغلاق">×</button>              <h2>سوق المبرمجين العرب</h2>              <div class="tabs">               <button data-action="auth-tab"                       data-mode="login"                       class="${!registering ? "active" : ""}">                 تسجيل الدخول               </button>                <button data-action="auth-tab"                       data-mode="register"                       class="${registering ? "active" : ""}">                 إنشاء حساب               </button>             </div>              <form id="authForm" data-mode="${mode}">               ${registering ? `                 <div class="form-grid">                   <div class="field">                     <label>الاسم</label>                     <input name="first" required maxlength="50">                   </div>                    <div class="field">                     <label>اسم العائلة</label>                     <input name="last" required maxlength="50">                   </div>                 </div>                  <div class="field">                   <label>اسم المستخدم</label>                   <input name="username"                          required                          pattern="[a-zA-Z0-9_]{4,30}"                          placeholder="ahmed_dev">                   <small class="hint">                     من 4 إلى 30 حرفًا إنجليزيًا أو رقمًا أو _.                   </small>                 </div>                  <div class="field">                   <label>الدولة ورمز الاتصال</label>                   <select name="country_code">                     ${countries.map(([country, code]) => `                       <option value="${code}">                         ${esc(country)} (+${code})                       </option>                     `).join("")}                   </select>                 </div>                  <div class="form-grid">                   <div class="field">                     <label>رقم الهاتف المحلي</label>                     <input name="phone"                            inputmode="numeric"                            required                            placeholder="بدون رمز الدولة">                   </div>                    <div class="field">                     <label>رقم واتساب المحلي</label>                     <input name="whatsapp"                            inputmode="numeric"                            required                            placeholder="بدون رمز الدولة">                   </div>                 </div>                  <div class="field">                   <label>نوع الحساب</label>                   <select name="role">                     <option value="seller">بائع</option>                     <option value="buyer">مشتري</option>                   </select>                 </div>               ` : ""}                <div class="field">
                  <label>
                    ${registering ? "البريد الإلكتروني" : "البريد الإلكتروني أو اسم المستخدم"}
                  </label>
                  <input name="email"
                         type="${registering ? "email" : "text"}"
                         required
                         autocomplete="${registering ? "email" : "username"}"
                         placeholder="${registering ? "example@email.com" : "example@email.com أو ahmed_dev"}">
                </div>                <div class="field">                 <label>كلمة المرور</label>                 <input name="password"                        type="password"                        required                        minlength="8"                        autocomplete="${registering ? "new-password" : "current-password"}">               </div>                ${registering ? `                 <div class="field">                   <label>تأكيد كلمة المرور</label>                   <input name="confirm_password"                          type="password"                          required minlength="8">                 </div>               ` : ""}                <button class="btn primary" style="width:100%">                 ${registering ? "إنشاء الحساب" : "دخول"}               </button>                ${
                  registering
                    ? ""
                    : `<button type="button"
                             class="btn small soft top-gap"
                             data-action="reset">
                       نسيت كلمة المرور؟
                     </button>`
                }             </form>           </div>         </div>       `;
      }
      function openPasswordReset() {
        $("#modalRoot").innerHTML =
          `         <div class="modal">           <div class="modal-box">             <h2>تعيين كلمة مرور جديدة</h2>             <form id="passwordForm">               <div class="field">                 <label>كلمة المرور الجديدة</label>                 <input name="password"                        type="password"                        required minlength="8">               </div>               <button class="btn primary">حفظ كلمة المرور</button>             </form>           </div>         </div>       `;
      }
      function phoneNumber(code, local) {
        const digits = String(local)
          .replace(/[٠-٩]/g, (digit) => "٠١٢٣٤٥٦٧٨٩".indexOf(digit))
          .replace(/\D/g, "")
          .replace(/^0+/, "");
        return digits.length >= 7 && code.length + digits.length <= 15
          ? `+${code}${digits}`
          : "";
      }
      async function imageUpload(file) {
        if (!file) return null;
        if (!file.type.startsWith("image/")) {
          throw Error("اختر ملف صورة.");
        }
        const source = URL.createObjectURL(file);
        let blob;
        try {
          const image = new Image();
          image.src = source;
          await image.decode();
          const scale = Math.min(1, 1800 / Math.max(image.width, image.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(image.width * scale));
          canvas.height = Math.max(1, Math.round(image.height * scale));
          const context = canvas.getContext("2d");
          context.fillStyle = "#ffffff";
          context.fillRect(0, 0, canvas.width, canvas.height);
          context.drawImage(image, 0, 0, canvas.width, canvas.height);
          blob = await new Promise((resolve) => {
            canvas.toBlob(resolve, "image/jpeg", 0.82);
          });
          if (!blob || blob.size > 5 * 1024 * 1024) {
            throw Error("الصورة كبيرة. اختر صورة أصغر.");
          }
        } finally {
          URL.revokeObjectURL(source);
        }
        const path = `${me.id}/${crypto.randomUUID()}.jpg`;
        const { error } = await db.storage
          .from("market-images")
          .upload(path, blob, {
            contentType: "image/jpeg",
            upsert: false,
          });
        if (error) throw error;
        return path;
      }
      async function authSubmit(form) {
        const values = Object.fromEntries(new FormData(form));
        if (form.dataset.mode === "login") {
          const identifier = String(values.email || "")
            .trim()
            .toLowerCase();
          const password = values.password;
          if (!identifier || !password) {
            throw Error("اكتب البريد الإلكتروني أو اسم المستخدم وكلمة المرور.");
          }
          if (identifier.includes("@")) {
            const { error } = await db.auth.signInWithPassword({
              email: identifier,
              password,
            });
            if (error) {
              throw Error("البريد الإلكتروني أو كلمة المرور غير صحيحة.");
            }
          } else {
            if (!/^[a-z0-9_]{4,30}$/.test(identifier)) {
              throw Error("اسم المستخدم غير صالح.");
            }
            const { data, error } = await db.functions.invoke(
              "login-by-username",
              {
                body: {
                  username: identifier,
                  password,
                },
              },
            );
            if (error || !data?.access_token || !data?.refresh_token) {
              throw Error(
                data?.message || "اسم المستخدم أو كلمة المرور غير صحيحة.",
              );
            }
            const { error: sessionError } = await db.auth.setSession({
              access_token: data.access_token,
              refresh_token: data.refresh_token,
            });
            if (sessionError) throw sessionError;
          }
          $("#modalRoot").innerHTML = "";
          location.hash = "#/dashboard/profile";
          toast("أهلًا بعودتك!");
          return;
        }
        if (values.password !== values.confirm_password) {
          throw Error("كلمتا المرور غير متطابقتين.");
        }
        const username = values.username.trim().toLowerCase();
        const whatsapp = phoneNumber(values.country_code, values.whatsapp);
        const phone = phoneNumber(values.country_code, values.phone);
        if (!/^[a-z0-9_]{4,30}$/.test(username)) {
          throw Error("اسم المستخدم غير صالح.");
        }
        if (!whatsapp || !phone) {
          throw Error("تحقق من رقمي الهاتف وواتساب.");
        }
        const existing = await db
          .from("profiles")
          .select("id")
          .eq("username", username)
          .maybeSingle();
        if (existing.error) throw existing.error;
        if (existing.data) {
          throw Error("اسم المستخدم مستخدم بالفعل. اختر اسمًا آخر.");
        }
        const { data, error } = await db.auth.signUp({
          email: values.email.trim().toLowerCase(),
          password: values.password,
          options: {
            data: {
              first_name: values.first.trim(),
              last_name: values.last.trim(),
              username,
              role: values.role,
              country_code: values.country_code,
              whatsapp,
              phone,
            },
          },
        });
        if (error) throw error;
        if (!data.session) {
          throw Error(
            "تم إنشاء الحساب لكن تأكيد البريد ما زال مفعّلًا في Supabase. عطّل Confirm email ثم جرّب بحساب جديد.",
          );
        }
        $("#modalRoot").innerHTML = "";
        location.hash = "#/dashboard/profile";
        toast("تم إنشاء الحساب وتسجيل الدخول بنجاح.");
      }
      async function profileSubmit(form) {
        const values = Object.fromEntries(new FormData(form));
        const username = values.username.trim().toLowerCase();
        const whatsapp = phoneNumber(
          values.country_code,
          values.whatsapp_local,
        );
        const phone = phoneNumber(values.country_code, values.phone_local);
        if (!/^[a-z0-9_]{4,30}$/.test(username)) {
          throw Error("اسم المستخدم غير صالح.");
        }
        const usernameCheck = await db
          .from("profiles")
          .select("id")
          .eq("username", username)
          .neq("id", me.id)
          .maybeSingle();
        if (usernameCheck.error) throw usernameCheck.error;
        if (usernameCheck.data) {
          throw Error("اسم المستخدم مستخدم بالفعل. اختر اسمًا آخر.");
        }
        if (!whatsapp || !phone) {
          throw Error("تحقق من رقمي الهاتف وواتساب.");
        }
        const path = await imageUpload(selectedFile);
        const country =
          countries.find(([, code]) => code === values.country_code)?.[0] || "";
        const changes = {
          first_name: values.first_name.trim(),
          last_name: values.last_name.trim(),
          username,
          country_code: values.country_code,
          country,
          whatsapp,
          role: values.role,
          bio: values.bio.trim(),
        };
        if (path) changes.avatar_path = path;
        const profileUpdate = await db
          .from("profiles")
          .update(changes)
          .eq("id", me.id);
        if (profileUpdate.error) throw profileUpdate.error;
        const privateUpdate = await db
          .from("account_details")
          .update({
            phone,
          })
          .eq("user_id", me.id);
        if (privateUpdate.error) throw privateUpdate.error;
        selectedFile = null;
        await loadMe();
        renderNav();
        dashboard("profile");
        toast("تم تحديث ملفك.");
      }
      async function serviceSubmit(form) {
        if (me?.role !== "seller") {
          throw Error("هذه الميزة لحساب البائع.");
        }
        const values = Object.fromEntries(new FormData(form));
        const id = form.dataset.id;
        const path = await imageUpload(selectedFile);
        const row = {
          seller_id: me.id,
          title: values.title.trim(),
          category: values.category,
          description: values.description.trim(),
          price: Number(values.price),
        };
        if (path) row.cover_path = path;
        const result = id
          ? await db
              .from("services")
              .update(row)
              .eq("id", id)
              .eq("seller_id", me.id)
          : await db.from("services").insert(row);
        if (result.error) throw result.error;
        selectedFile = null;
        await dashServices();
        toast("تم حفظ الخدمة.");
      }
      async function workSubmit(form) {
        if (me?.role !== "seller") {
          throw Error("هذه الميزة لحساب البائع.");
        }
        const values = Object.fromEntries(new FormData(form));
        const id = form.dataset.id;
        const path = await imageUpload(selectedFile);
        if (!id && !path) {
          throw Error("أضف صورة للعمل.");
        }
        const row = {
          seller_id: me.id,
          title: values.title.trim(),
          description: values.description.trim(),
          link: values.link.trim() || null,
        };
        if (path) row.image_path = path;
        const result = id
          ? await db
              .from("portfolio")
              .update(row)
              .eq("id", id)
              .eq("seller_id", me.id)
          : await db.from("portfolio").insert(row);
        if (result.error) throw result.error;
        selectedFile = null;
        await dashPortfolio();
        toast("تم حفظ العمل.");
      }
      document.addEventListener("click", async (event) => {
        const button = event.target.closest("[data-action]");
        if (!button) return;
        const action = button.dataset.action;
        try {
          if (action === "auth" || action === "auth-tab") {
            openAuth(button.dataset.mode);
          }
          if (action === "close") {
            $("#modalRoot").innerHTML = "";
          }
          if (action === "logout") {
            const { error } = await db.auth.signOut();
            if (error) throw error;
            location.hash = "#/";
          }
          if (action === "filter") {
            filter.category = button.dataset.category;
            drawCards();
          }
          if (action === "dash") {
            location.hash = "#/dashboard/" + button.dataset.tab;
            dashboard(button.dataset.tab);
          }
          if (action === "back-services") {
            await dashServices();
          }
          if (action === "back-portfolio") {
            await dashPortfolio();
          }
          if (action === "service-form") {
            await serviceForm(button.dataset.id);
          }
          if (action === "work-form") {
            await workForm(button.dataset.id);
          }
          if (action === "whatsapp") {
            const number = button.dataset.number.replace(/\D/g, "");
            const message =
              "مرحبًا، رأيت " +
              (button.dataset.title
                ? `خدمتك «${button.dataset.title}»`
                : "صفحتك") +
              " على سوق المبرمجين العرب وأرغب في معرفة التفاصيل.";
            if (number) {
              window.open(
                `https://wa.me/${number}?text=${encodeURIComponent(message)}`,
                "_blank",
                "noopener,noreferrer",
              );
            }
          }
          if (action === "reset") {
            const email = $("#authForm [name=email]")?.value.trim();
            if (!email || !email.includes("@")) {
              throw Error(
                "لإعادة تعيين كلمة المرور اكتب بريدك الإلكتروني في الخانة أولًا.",
              );
            }
            const { error } = await db.auth.resetPasswordForEmail(email, {
              redirectTo: location.origin + location.pathname,
            });
            if (error) throw error;
            toast("راجع بريدك الإلكتروني لفتح رابط إعادة تعيين كلمة المرور.");
          }
          if (action === "delete-service" || action === "delete-work") {
            if (!confirm("هل تريد حذف هذا العنصر؟")) return;
            const table =
              action === "delete-service" ? "services" : "portfolio";
            const { error } = await db
              .from(table)
              .delete()
              .eq("id", button.dataset.id)
              .eq("seller_id", me.id);
            if (error) throw error;
            if (table === "services") {
              await dashServices();
            } else {
              await dashPortfolio();
            }
            toast("تم الحذف.");
          }
        } catch (error) {
          showError(error);
        }
      });
      document.addEventListener("submit", async (event) => {
        const form = event.target;
        const supported = [
          "heroSearch",
          "authForm",
          "profileForm",
          "serviceForm",
          "workForm",
          "passwordForm",
        ];
        if (!supported.includes(form.id)) return;
        event.preventDefault();
        if (form.id === "heroSearch") {
          filter.query = String(new FormData(form).get("q") || "").trim();
          location.hash = "#/services";
          return;
        }
        const button = form.querySelector('button:not([type="button"])');
        if (button) button.disabled = true;
        try {
          if (form.id === "authForm") await authSubmit(form);
          if (form.id === "profileForm") await profileSubmit(form);
          if (form.id === "serviceForm") await serviceSubmit(form);
          if (form.id === "workForm") await workSubmit(form);
          if (form.id === "passwordForm") {
            const password = new FormData(form).get("password");
            const { error } = await db.auth.updateUser({
              password,
            });
            if (error) throw error;
            recoveryMode = false;
            $("#modalRoot").innerHTML = "";
            toast("تم تغيير كلمة المرور.");
          }
        } catch (error) {
          showError(error);
        } finally {
          if (button) button.disabled = false;
        }
      });
      document.addEventListener("input", (event) => {
        if (event.target.id === "catalogSearch") {
          filter.query = event.target.value.trim();
          drawCards();
        }
      });
      document.addEventListener("change", (event) => {
        const input = event.target;
        if (!input.matches('input[type="file"][data-preview]')) {
          return;
        }
        const file = input.files?.[0];
        if (!file) return;
        if (!file.type.startsWith("image/") || file.size > 20 * 1024 * 1024) {
          input.value = "";
          toast("اختر صورة بحجم لا يتجاوز 20 ميجابايت.", true);
          return;
        }
        selectedFile = file;
        const preview = document.getElementById(input.dataset.preview);
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
      });
      window.addEventListener("hashchange", () => {
        selectedFile = null;
        route();
        window.scrollTo(0, 0);
      });
      init();
    </script>
  </body>
